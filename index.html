<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brandão Imobiliária</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f4ef;
      color: #141414;
    }
    .wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }
    .box {
      max-width: 900px;
      width: 100%;
      text-align: center;
    }
    h1 {
      margin-bottom: 12px;
    }
    p {
      color: #555;
      margin-bottom: 28px;
    }
    .links {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
    }
    a {
      text-decoration: none;
      background: #b89d6a;
      color: #fff;
      padding: 14px 22px;
      border-radius: 8px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="box">
      <h1>Brandão Imobiliária</h1>
      <p>Selecione um empreendimento para conhecer.</p>
      <div class="links">
        <a href="/zion">Conhecer Zion</a>
        <a href="/mood">Conhecer Mood</a>
        <a href="/loft">Conhecer Loft</a>
      </div>
    </div>
  </div>
</body>
</html>
